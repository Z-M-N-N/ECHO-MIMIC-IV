seed: 42
task: cls_la_size
num_classes:
  cls_rv_function: 2
  cls_la_size: 2
  cls_ra_size: 2
views:
  A4C:
    csv: /home/mzhao/ECHO-MIMIC-IV/data/A4C/classification.csv
  A2C:
    csv: /home/mzhao/ECHO-MIMIC-IV/data/A2C/classification.csv
frame:
  num_frames: 16
  image_size: 224
prompt:
  view_names:
    A4C: A4C 心尖四腔
    A2C: A2C 心尖两腔
  question: 请根据视频判断左房大小分级：0=正常，1=增大。只回答 0 或 1。
  anchor_text: 答案：
model:
  path: /mnt/disk5/mzhao/公共大模型/Qwen2.5-VL-3B
  dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: false
representation:
  layer: 9
  pooling: visual_mean
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
head:
  hidden_dims:
  - 512
  - 256
  dropout: 0.2
  input_norm: true
train:
  epochs: 2
  patience: 2
  batch_size: 1
  grad_accum: 8
  lr_lora: 5.0e-05
  lr_head: 0.001
  weight_decay: 0.0001
  class_weight: balanced
  focal_gamma: 0.0
  grad_clip: 1.0
  log_every: 20
  num_workers: 4
  batch_size_single: 2
  batch_size_joint: 2
  eval_batch_size: 2
  eval_train_samples: 1000
groups:
- name: A4C
  views:
  - A4C
- name: A2C
  views:
  - A2C
- name: A4C+A2C
  views:
  - A4C
  - A2C
output:
  root: /home/mzhao/ECHO-MIMIC-IV/out
